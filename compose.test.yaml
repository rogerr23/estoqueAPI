services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: estoque_test
      POSTGRES_USER: estoque_test
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:?Defina TEST_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque_test -d estoque_test"]
      interval: 2s
      timeout: 5s
      retries: 30
