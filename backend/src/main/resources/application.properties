spring.application.name=estoque-api
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:estoque_dev}
spring.datasource.username=${POSTGRES_USER:estoque}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.address=127.0.0.1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Rejeitar quantidades fracionárias e campos fora do contrato (ex.: responsável).
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
